      official: true
    license:
      identifier: Apache-2.0
      review_status: pending
    capabilities:
      - vision.analyze@1
      - vision.extract_structured@1
      - vision.classify@1
      - text.generate@1
    target_profiles:
      - hermes-cpu-8vcpu-16gib
    spike_evidence:
      report: benchmarks/results/G06-VISION-DOCUMENTS-2026-08-28.md
      families: [V-01, V-02]
    limitations_to_test:
      - cold start and CPU latency
      - tiny text
      - multi-image reasoning
