  - id: qwen3-asr-0.6b
    status: candidate
    source:
      repository: Qwen/Qwen3-ASR-0.6B
      official: true
    license:
      identifier: Apache-2.0
      review_status: pending
    capabilities:
      - audio.transcribe@1
    intended_role:
      - alternative to Whisper baseline
    limitations_to_test:
      - CPU packaging and real-time factor
      - French quality
      - streaming maturity

specialist_families_to_discover:
  object_detection:
    desired_runtime: ONNX
    status: discovered
    selection_basis:
      - CPU latency
      - coordinates and class accuracy
      - licence
      - model size
  image_embeddings:
    desired_runtime: ONNX
    status: discovered
    selection_basis:
      - multilingual/text-image compatibility
      - duplicate and similarity quality
      - dimensions and storage cost
  fast_text_embeddings:
    desired_runtime: ONNX
    status: discovered
    selection_basis:
      - French semantic retrieval
      - batch throughput
      - dimensions
      - licence
