      official: true
    license:
      identifier: Apache-2.0
      review_status: pending
    capabilities:
      - text.embed@1
    target_profiles:
      - hermes-cpu-8vcpu-16gib
    alternatives:
      - smaller ONNX/FastEmbed multilingual models

  - id: qwen3-reranker-0.6b
    status: candidate
    source:
      repository: Qwen/Qwen3-Reranker-0.6B
      official: true
    license:
      identifier: Apache-2.0
      review_status: pending
    capabilities:
      - search.rerank@1
    target_profiles:
      - hermes-cpu-8vcpu-16gib
    alternatives:
      - compact ONNX cross-encoders

  - id: qwen3-0.6b
    status: candidate
    source:
      repository: Qwen/Qwen3-0.6B
      official: true
    license:
      identifier: Apache-2.0
      review_status: pending
    capabilities:
      - text.extract_structured@1
      - text.classify@1
      - text.generate@1
