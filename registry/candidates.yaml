schema_version: 1
updated_at: "2026-08-28"
notice: >
  Candidates are not installed, benchmarked, approved, or bundled. Exact
  revisions, files, hashes, and engine compatibility are installation records.
  G-03 spike measurements: benchmarks/results/G03-ENGINE-SPIKE-2026-08-28.md.
  G-06 task families: benchmarks/results/G06-VISION-DOCUMENTS-2026-08-28.md.

engines:
  - id: llama-cpp
    status: benchmarked
    source: https://github.com/ggml-org/llama.cpp
    license: MIT
    spike_evidence:
      build: b10662
      report: benchmarks/results/G03-ENGINE-SPIKE-2026-08-28.md
    roles:
      - text_generation
      - multimodal_generation
      - embeddings
      - reranking
      - structured_output
    rationale:
      - CPU-first GGUF inference
      - OpenAI-compatible server surfaces
      - future accelerator backends
    risks:
      - multimodal and flags are version-sensitive
      - model lifecycle requires orchestration
    required_gate: G-03

  - id: llama-swap
    status: benchmarked
    source: https://github.com/mostlygeek/llama-swap
    license: MIT
    spike_evidence:
      build: v251
      report: benchmarks/results/G03-ENGINE-SPIKE-2026-08-28.md
    roles:
      - process_lifecycle
      - on_demand_loading
      - idle_unload
    risks:
      - must not become the domain source of truth
      - YAML listen ignored; loopback must be forced via CLI flag
      - no built-in auth; must stay behind the control plane
    required_gate: G-03

  - id: localai
    status: blocked
    source: https://github.com/mudler/LocalAI
    license: MIT
    block_reason: >
      G-03 measurement on the target VM: llama-cpp backend never completed
      loading a 0.6B Q8 GGUF within 10 minutes (two attempts) while pinned
      llama.cpp serves the same file in under 4 s; 3.88 GB image; unwanted
      operational scope. See ADR-0003.
    required_gate: G-03

  - id: paddleocr
    status: candidate
    source: https://github.com/PaddlePaddle/PaddleOCR
    license: Apache-2.0
    roles:
      - ocr
      - document_layout
      - document_parsing
    required_gate: G-06
    note: Not installed or measured in the G-06 lot. Tesseract is the measured OCR route.

  - id: tesseract
    status: benchmarked
    source: https://github.com/tesseract-ocr/tesseract
    license: Apache-2.0
    spike_evidence:
      version: 5.3.4
      report: benchmarks/results/G06-VISION-DOCUMENTS-2026-08-28.md
    roles:
      - ocr
    required_gate: G-06

  - id: whisper-cpp
    status: candidate
    source: https://github.com/ggml-org/whisper.cpp
    license: MIT
    roles:
      - speech_to_text
    required_gate: G-08

model_families:
  - id: qwen3-vl-2b-instruct-gguf
    status: benchmarked
    source:
