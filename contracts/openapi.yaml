openapi: 3.1.0
info:
  title: Hermes Local AI Runtime API
  version: 0.2.0-dev
  description: >
    G-05 loopback contract. Native `/api/v1` is normative; `/v1` is a
    compatibility adapter. Operations marked `planned` are not implemented.
  license:
    name: Apache-2.0
servers:
  - url: http://127.0.0.1:8850
    description: G-05 loopback example
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      x-implementation-status: implemented-g05
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Process liveness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      x-implementation-status: implemented-g05
      security: []
      operationId: getReadiness
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Alive but not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/system:
    get:
      x-implementation-status: implemented-g05
      operationId: describeSystem
      responses:
        "200":
          description: Public-safe runtime description
  /api/v1/capabilities:
    get:
      x-implementation-status: implemented-g05
      operationId: listCapabilities
      parameters:
        - in: query
          name: available
          schema: {type: boolean}
      responses:
        "200":
          description: Capability catalogue
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Capability"
  /api/v1/jobs:
    post:
      x-implementation-status: implemented-g05
      operationId: submitJob
      parameters:
        - in: header
          name: Idempotency-Key
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/job-request.schema.json"
      responses:
        "200":
          description: Idempotent replay of the original job submission
        "202":
          description: Asynchronous job accepted
          headers:
            Location:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/jobs/{job_id}:
    get:
      x-implementation-status: implemented-g05
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job state or result
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/jobs/{job_id}/cancel:
    post:
      x-implementation-status: implemented-g05
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job was already terminal; current immutable status returned
        "202":
          description: Cancellation requested
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/jobs/{job_id}/result:
    get:
      x-implementation-status: implemented-g05
      operationId: getJobResult
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Immutable result with timing and provenance
          content:
            application/json:
              schema:
                $ref: "../schemas/job-result.schema.json"
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/uploads:
    post:
      x-implementation-status: implemented-g05
      operationId: uploadBoundedInput
      description: >
        Streams a bounded raw body to a bounded volatile memory store. Content
        is never written to disk or logged and disappears at process shutdown.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "201": {description: Upload metadata; never the payload}
        "413": {$ref: "#/components/responses/Error"}
  /metrics:
    get:
      x-implementation-status: implemented-g05
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text metrics without payload labels
          content:
            text/plain:
              schema: {type: string}
  /api/v1/models:
    get:
      x-implementation-status: planned
      operationId: listModels
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [discovered, candidate, compatible, benchmarked, approved, deprecated, blocked]
      responses:
        "200":
          description: Public-safe model registry
  /api/v1/evaluations:
    post:
      x-implementation-status: planned
      operationId: runEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [suite, route]
              properties:
                suite: {type: string}
                route: {type: string}
                corpus_mount: {type: string}
                publish_public_summary: {type: boolean, default: false}
      responses:
        "202":
          description: Evaluation accepted
  /v1/models:
    get:
      x-implementation-status: implemented-g05
      operationId: listCompatibleModels
      responses:
        "200":
          description: Approved compatibility aliases
  /v1/chat/completions:
    post:
      x-implementation-status: implemented-g05
      operationId: createChatCompletion
      description: OpenAI-compatible adapter; arbitrary engine flags are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              additionalProperties: false
              properties:
                model: {type: string}
                messages:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items:
                    type: object
                    additionalProperties: false
                    required: [role, content]
                    properties:
                      role: {type: string}
                      content: {type: string}
                max_tokens: {type: integer, minimum: 1, maximum: 2048, default: 256}
                stream: {type: boolean, default: false}
      responses:
        "200":
          description: Compatible non-streaming response
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
  /v1/responses:
    post:
      x-implementation-status: planned
      operationId: createResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              additionalProperties: true
      responses:
        "200": {description: Compatible response or event stream}
  /v1/embeddings:
    post:
      x-implementation-status: implemented-g07
      operationId: createEmbeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: {type: string}
                input:
                  oneOf:
                    - {type: string}
                    - {type: array, items: {type: string}}
      responses:
        "200": {description: Embedding response}
  /v1/rerank:
    post:
      x-implementation-status: implemented-g07
      operationId: rerank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model, query, documents]
              properties:
                model: {type: string}
                query: {type: string}
                documents: {type: array, maxItems: 100, items: {type: string}}
                top_n: {type: integer, minimum: 1, maximum: 100}
      responses:
        "200": {description: Ordered candidates}
  /v1/audio/transcriptions:
    post:
      x-implementation-status: implemented-g08
      operationId: transcribeAudio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model]
              properties:
                file: {type: string, format: binary}
                model: {type: string}
                language: {type: string}
      responses:
        "200": {description: Transcription response}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    JobId:
      in: path
      name: job_id
      required: true
      schema: {type: string, pattern: "^job_[A-Za-z0-9_-]+$"}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {const: ok}
    Readiness:
      type: object
      additionalProperties: false
      required: [status, control_plane, approved_routes]
      properties:
        status: {const: ready}
        control_plane: {type: boolean}
        approved_routes: {type: integer, minimum: 0}
    Capability:
      type: object
      additionalProperties: false
      required: [id, version, profiles, sync_allowed, status]
      properties:
        id: {type: string}
        version: {type: string}
        profiles: {type: array, items: {type: string, enum: [fast, balanced, accurate]}}
        sync_allowed: {type: boolean}
        status: {const: available}
    JobAccepted:
      type: object
      additionalProperties: false
      required: [job_id, capability, capability_version, profile, status, route_id, status_url, result_url]
      properties:
        job_id: {type: string}
        capability: {type: string}
        capability_version: {type: string}
        profile: {type: string, enum: [fast, balanced, accurate]}
        status: {const: queued}
        route_id: {type: string}
        status_url: {type: string}
        result_url: {type: string}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            request_id: {type: string, pattern: "^req_[A-Za-z0-9_-]+$"}
            retry_after_seconds: {type: integer, minimum: 0}
            details: {type: array, items: {type: object, additionalProperties: true}}
  responses:
    Error:
      description: Stable runtime error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
