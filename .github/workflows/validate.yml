name: validate-bootstrap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install document tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra poppler-utils fonts-dejavu-core
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate bootstrap
        run: python scripts/validate_bootstrap.py
      - name: Run tests
        run: pytest
